reflective_agent:
  enable_reflective_agent: true
  python_executable: /root/miniconda3/envs/apexnav/bin/python
  project_root: /root/autodl-tmp/ApexNav/agent-Apexnav
  enable_vlm_skill_selector: true
  vlm_provider: openai
  vlm_model: gpt-5.5
  vlm_model_env: OPENAI_MODEL
  vlm_api_key: null
  vlm_base_url: https://ai.happyclaw.pro/v1
  vlm_base_url_env: OPENAI_BASE_URL
  vlm_api_key_env: OPENAI_API_KEY
  vlm_timeout_seconds: 30.0
  vlm_temperature: 0.0
  vlm_force_json_response_format: false
  max_vlm_calls_per_episode: 100
  enable_decision_validator: true
  enable_monitored_skill_executor: true
  enable_reflection_memory: true
  enable_episode_reflection: true
  memory_path: data/reflection_memory.jsonl
  memory_read_mode: enabled
  memory_write_mode: all
  max_retrieved_lessons: 5
  max_reflection_memory_items: 10000
  agent_decision_interval: waypoint
  fallback_policy: apexnav
  target_verify_threshold: 0.65
  target_stop_threshold: 0.75
  require_multiview_before_stop: true
  semantic_peak_ratio_threshold: 2.5
  semantic_peak_std_threshold: 0.15
  stuck_threshold: 3
  same_frontier_failure_threshold: 2
  low_information_gain_threshold: 0.01
  enable_policy_patch_table: true
  policy_patch_path: data/policy_patches.json
  auto_activate_policy_patches: false
  min_policy_patch_support: 3
  disable_failure_taxonomy: false
  disable_recover_from_stuck: true
  policy_patch_confidence_threshold: 0.7
  enable_episode_logger: true
  episode_log_root: logs/reflective_agent
  run_id: default
  enable_learning_from_traces: true
  enable_self_hindsight_learning: false
  enable_baseline_teacher_learning: false
  enable_gt_teacher_learning: true
  enable_runtime_gt_progress_learning: true
  enable_gt_trajectory_learning: true
  enable_vlm_gt_trajectory_reflection: true
  gt_path_deviation_threshold: 1.5
  gt_path_deviation_growth_threshold: 0.5
  gt_path_max_points: 80
  gt_path_reflection_lookahead: 3
  max_gt_trajectory_reflections_per_episode: 3
  gt_progress_min_delta: 0.25
  gt_learning_max_samples_per_episode: 8
  tool_call_dataset_path: data/tool_call_learning_samples.jsonl
  baseline_teacher_log_path: ""
  gt_trajectory_path: ""
  learning_write_mode: all
  learning_record_policy_patches: true
